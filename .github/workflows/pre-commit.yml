name: Pre-commit

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    name: Run pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --ignore-scripts --package-lock=false
      - uses: pre-commit/action@v3.0.1
